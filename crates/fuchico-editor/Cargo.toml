[package]
name = "fuchico-editor"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Native GPUI Markdown editor for Fuchico: fuchico-helix modal engine + fuchico-markdown live preview"

[dependencies]
gpui-kit.workspace = true
fuchico-helix.workspace = true
fuchico-markdown.workspace = true
fuchico-core.workspace = true
ropey.workspace = true
regex.workspace = true
chrono.workspace = true
unicode-segmentation.workspace = true
log.workspace = true

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`). Not gpui-kit/test-support (it
# drags the conflicting gpui-fast tree into the lockfile).
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
# Offscreen snapshots: headless Metal renderer + PNG output.
gpui-pre-platform = { version = "=0.3.9", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { version = "=0.3.9", features = ["font-kit"] }

[[example]]
name = "editor_demo"
path = "examples/editor_demo.rs"
