[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]
default-members = ["apps/fuchico"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
fuchico-core = { path = "crates/fuchico-core" }
fuchico-helix = { path = "crates/fuchico-helix" }
fuchico-markdown = { path = "crates/fuchico-markdown" }
fuchico-mermaid = { path = "crates/fuchico-mermaid" }
gpui-kit = "0.7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = "1.6"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
fuchico-excalidraw = { path = "crates/fuchico-excalidraw" }
fuchico-editor = { path = "crates/fuchico-editor" }
roughr = "0.14"
euclid = "0.22"
palette = "0.7"
ttf-parser = "0.25"
image = "0.25"
base64 = "0.22"
sha2 = "0.11"
rand = "0.8"
indexmap = { version = "2", features = ["serde"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
png = "0.17"
dirs = "6"
objc = "0.2"
raw-window-handle = "0.6"
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
