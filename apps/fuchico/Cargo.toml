[package]
name = "fuchico"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
fuchico-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
log.workspace = true
chrono.workspace = true
dirs.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse"] }
futures = "0.3"
sys-locale = "0.3"
rand = "0.9"
lsp-types = "0.97"
fuchico-excalidraw.workspace = true
fuchico-mermaid.workspace = true
fuchico-markdown.workspace = true
fuchico-editor.workspace = true
fuchico-helix.workspace = true
pulldown-cmark.workspace = true
typst = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
base64.workspace = true
typst-layout = "0.15"

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`): enables gpui's TestAppContext.
# Not gpui-kit/test-support: its weak `gpui-fast?/…` features drag the
# conflicting gpui-fast tree into the lockfile.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
# Offscreen snapshots (src/snapshot.rs): headless Metal renderer + PNG output.
gpui-pre-platform = { version = "=0.3.9", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

# Snapshot text system off the main thread (MacPlatform::new requires the
# main thread; libtest runs tests on worker threads).
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { version = "=0.3.9", features = ["font-kit"] }

# macOS / Linux packaging, mirroring src-tauri/tauri.conf.json `bundle`.
# `scripts/bundle-macos.sh` assembles the .app without extra tools (it uses
# resources/macos/Info.plist); `cargo bundle --release` reads this table.
[package.metadata.bundle]
name = "Fuchico"
identifier = "dev.fuleco.fuchico"
icon = [
    "resources/icons/32x32.png",
    "resources/icons/128x128.png",
    "resources/icons/128x128@2x.png",
    "resources/icons/icon.icns",
    "resources/icons/icon.ico",
]
category = "Productivity"
short_description = "Notes editor with Helix modal editing"
long_description = "Fuchico is a standalone desktop notes editor: plain markdown files on disk, edited with real Helix keybindings, with live preview, tasks, tags, backlinks and CalDAV sync."
copyright = "© 2026 FulecoRafa"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["resources/macos/document-types.plist"]
linux_mime_types = ["text/markdown"]
deb_depends = []
