[package]
name = "fuchico"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
fuchico-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
log.workspace = true
chrono.workspace = true
futures = "0.3"
sys-locale = "0.3"
rand = "0.9"

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`): enables gpui's TestAppContext.
# Not gpui-kit/test-support: its weak `gpui-fast?/…` features drag the
# conflicting gpui-fast tree into the lockfile.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
